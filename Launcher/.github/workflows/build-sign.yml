# Compila Launcher.exe, lo firma con SignPath.io y lo adjunta a una Release.
#
# ANTES DE QUE FUNCIONE, rellena en el repo de GitHub:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     SIGNPATH_API_TOKEN   = (token de usuario/CI que generas en app.signpath.io)
#
# Y sustituye abajo los <<...>> por los valores de tu organizacion en SignPath
# (Project -> "slug", Signing policy -> "slug", Organization Id en la URL/ajustes).
#
# Dispara:
#   - al hacer push de una etiqueta  vX.Y.Z   -> firma y crea la Release
#   - manualmente desde la pestana Actions     -> solo firma (sin Release)

name: build-sign

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write      # crear la Release
  id-token: write       # SignPath verifica la procedencia del build via OIDC de GitHub

jobs:
  build-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (self-contained, single file)
        run: dotnet publish UltraYeaLauncher.csproj -c Release -o dist

      - name: Subir artefacto sin firmar
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: launcher-unsigned
          path: dist/Launcher.exe
          if-no-files-found: error

      - name: Firmar con SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: "<<ORGANIZATION_ID>>"
          project-slug: "<<PROJECT_SLUG>>"
          signing-policy-slug: "<<SIGNING_POLICY_SLUG>>"
          # artifact-configuration-slug: "<<ARTIFACT_CONFIG_SLUG>>"   # opcional
          github-artifact-id: "${{ steps.upload.outputs.artifact-id }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: "signed"

      - name: Comprobar la firma
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "signed/Launcher.exe"
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "La firma no es valida: $($sig.Status)" }

      - name: Adjuntar Launcher.exe firmado a la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: signed/Launcher.exe
          fail_on_unmatched_files: true
